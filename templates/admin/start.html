
{% extends 'base.html' %}
{% block content %}
<style>
  .admin { max-width: 760px; margin: 24px auto; color: #eee; font-family: system-ui, sans-serif; }
  .admin a { color: #8ab4f8; }
  .admin h2 { margin: 8px 0 18px; }
  .admin form { display: grid; grid-template-columns: 140px 1fr; gap: 10px 14px; align-items: center; }
  .admin label { text-align: right; color: #bbb; font-size: 14px; }
  .admin input, .admin select { padding: 6px 8px; border-radius: 6px; border: 1px solid #555;
                                background: #1b1b1b; color: #eee; font-size: 14px; }
  .admin .info { grid-column: 2; margin-top: -4px; font: 12.5px/1.45 monospace; color: #aaa;
                 white-space: pre-wrap; }
  .admin fieldset { grid-column: 1 / -1; display: grid; grid-template-columns: 126px 1fr;
                    gap: 10px 14px; align-items: center; border: 1px solid #444;
                    border-radius: 8px; padding: 10px 14px; }
  .admin legend { color: #bbb; padding: 0 6px; font-size: 13px; }
  .admin .error { background: #3a1212; border: 1px solid #b33; color: #ffb4b4;
                  padding: 8px 12px; border-radius: 6px; margin-bottom: 16px; }
  .admin button { grid-column: 2; justify-self: start; padding: 8px 22px; border: 0;
                  border-radius: 6px; background: #2f6fd1; color: #fff; font-size: 15px; cursor: pointer; }
</style>

<div class="admin">
  <p><a href="{{ url_for('admin_sessions') }}">← Sessions</a></p>
  <h2>Start a session</h2>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}

  <form method="post">
    <label for="room_id">Room</label>
    <input id="room_id" name="room_id" value="{{ form.get('room_id', '') }}" required>

    <label for="task">Task</label>
    <select id="task" name="task" required>
      {% for t in catalogue %}
      <option {% if form.get('task') == t %}selected{% endif %}>{{ t }}</option>
      {% endfor %}
    </select>

    <label for="variant">Variant</label>
    <select id="variant" name="variant"></select>
    <div class="info" id="variant-info"></div>

    <label for="stimuli">Stimuli</label>

    <select id="stimuli" name="stimuli" required></select>

<!--   <input id="stimuli" name="stimuli" required> -->
    <label for="condition">Condition</label>
    <select id="condition" name="condition" required>
      {% for c in conditions %}
      <option {% if form.get('condition') == c %}selected{% endif %}>{{ c }}</option>
      {% endfor %}
    </select>
    <div class="info" id="condition-info"></div>

    <fieldset>
      <legend>Session overrides (optional)</legend>
      <label for="rounds">Rounds</label>
      <input id="rounds" name="rounds" value="{{ form.get('rounds', '') }}" placeholder="task default">
      <label for="time_limit">Time limit (s)</label>
      <input id="time_limit" name="time_limit" value="{{ form.get('time_limit', '') }}"
             placeholder="task default, or none">
    </fieldset>

    <label for="group_id">Group ID</label>
    <input id="group_id" name="group_id" value="{{ form.get('group_id', '') }}">

    <label for="notes">Notes</label>
    <input id="notes" name="notes" value="{{ form.get('notes', '') }}">

    <button>Start</button>
  </form>
</div>

<script>
  const CATALOGUE = {{ catalogue|tojson }};
  const CONDITIONS = {{ conditions|tojson }};
  const chosen = {{ {'variant': form.get('variant', ''), 'stimuli': form.get('stimuli', '')}|tojson }};
  const taskSel = document.getElementById('task');
  const variantSel = document.getElementById('variant');
  const stimSel = document.getElementById('stimuli');
  const condSel = document.getElementById('condition');

  function fill(select, items, keep) {
    select.replaceChildren();
    for (const [value, label] of items) select.add(new Option(label, value, false, value === keep));
  }

  function onTask() {
    const t = CATALOGUE[taskSel.value] || {variants: {}, stimuli: []};
    fill(variantSel, [['', 'task defaults'], ...Object.keys(t.variants).map(v => [v, v])], chosen.variant);
    fill(stimSel, t.stimuli.map(s => [s, s]), chosen.stimuli);
    onVariant();
    if (t.error) document.getElementById('variant-info').textContent = 'task error: ' + t.error;
  }

  function onVariant() {
    const v = (CATALOGUE[taskSel.value] || {variants: {}}).variants[variantSel.value];
    document.getElementById('variant-info').textContent =
      v ? Object.entries(v).map(([k, x]) => `${k}: ${x}`).join('\n') : '';
  }

  function onCondition() {
    document.getElementById('condition-info').textContent = CONDITIONS[condSel.value] || '';
  }

  taskSel.addEventListener('change', onTask);
  variantSel.addEventListener('change', onVariant);
  condSel.addEventListener('change', onCondition);
  onTask();
  onCondition();
</script>
{% endblock %}
