<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Team task chatroom</title>
    <link rel="stylesheet" href="{{url_for('static', filename='style/style.css')}}" />

    {% if participants|length==1 %}

	<style type="text/css">
	  .stimImage
	  {
	      padding: 1%;
	      height: calc(50%);
	  }

	  .stimImage img
	  {
	      padding-left: 5%;
	  }

	  #messages
	  {
	      flex: 50%;
	  }
	</style>

    {% endif %}
    

	<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.4/socket.io.js" integrity="sha512-dDCXSKyPaEikucluA6BrNqHngOGByBEhxwwlP+GvVt90XOe0BpmZEdnIJi849R2q9rG23Yzxhiy4uKCdnrJySw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    
  </head>
  <body>
    <div id="root">{% block content %} {% endblock %}</div>
  </body>
</html>
