{% extends 'base.html' %} {% block content %}

<style>
  /* ---- sizes: change these two numbers to resize everything ---- */
  #task-board { --tile: 110px; --cell: 44px; }
  .obs-board  { --tile: 56px;  --cell: 26px; }

  /* ---- matching boards ---- */
  .tb-grid { display: grid; gap: 4px; width: max-content; }
  .tb-slot { position: relative; width: var(--tile); height: var(--tile);
             background: #fff; border: 1px dashed #999; box-sizing: border-box; }
  .tb-slot img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .tb-num { position: absolute; top: 2px; left: 4px; font-size: 11px; color: #555; }
  .tb-label { margin: 8px 0 4px; font-weight: bold; color: #eee; }
  .tb-selected { outline: 3px solid #f5a623; outline-offset: -3px; }
  .tb-pool { display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(4 * var(--tile)); min-height: 40px; }
  .tb-card { width: calc(var(--tile) * 0.7); height: calc(var(--tile) * 0.7);
             background: #fff; object-fit: contain; cursor: pointer; border: 1px solid #999; }

  /* ---- observer boards: title on top, grid and pool side by side ---- */
  .stimImage:has(.obs-board:not(:empty)) { height: auto; overflow: visible; }
  .obs-board { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; padding: 4px; }
  .obs-board:empty { display: none; }
  .obs-title { flex-basis: 100%; color: #fff; font-weight: bold; font-size: 13px; }
  .obs-pool { display: grid; grid-template-columns: repeat(4, 30px); gap: 3px; }
  .obs-pool figure { margin: 0; text-align: center; }
  .obs-pool img { width: 30px; height: 30px; background: #fff; object-fit: contain; display: block; }
  .obs-pool figcaption { font-size: 10px; color: #fff; }

  /* ---- maze ---- */
  .mz-grid { display: grid; gap: 2px; width: max-content; }
  .mz-label { font-size: 11px; color: #ccc; display: flex; align-items: center;
              justify-content: center; padding: 0 3px; }
  .mz-cell { position: relative; width: var(--cell); height: var(--cell);
             display: flex; align-items: center; justify-content: center;
             font-weight: bold; font-size: calc(var(--cell) * 0.4); box-sizing: border-box; }
  .mz-unknown { background: #3a3a3a; }
  .mz-open    { background: #f4f4f4; color: #333; }
  .mz-wall    { background: #a0522d; }
  .mz-start   { background: #c8f0c8; color: #1a6b1a; }
  .mz-end     { background: #f8d0d0; color: #9b1c1c; }
  .mz-path    { box-shadow: inset 0 0 0 3px #4a90d9; }
  .mz-found   { outline: 2px solid #f5a623; }
  .mz-target  { box-shadow: inset 0 0 0 3px #f5a623; color: #f5a623; }
  .mz-token   { position: absolute; width: 60%; height: 60%; border-radius: 50%;
                background: #1f6fd1; border: 2px solid #fff; }
  .mz-status  { margin: 6px 0; color: #eee; font-size: 14px; }
  .mz-controls { display: grid; gap: 4px; width: max-content; margin: 6px 0;
                 grid-template-areas: ". up ." "left . right" ". down ."; }
  .mz-up { grid-area: up; } .mz-down { grid-area: down; }
  .mz-left { grid-area: left; } .mz-right { grid-area: right; }
  .mz-controls button, .mz-votes button { padding: 6px 10px; font-size: 14px; }

  .mz-votes { display: flex; flex-direction: column; gap: 4px; }
  .mz-vote-row { display: flex; gap: 6px; align-items: center; color: #eee; font-size: 14px; }  

  /* ---- command hints and system lines in the chat ---- */
  #cmd-hints { white-space: pre; font-family: monospace; font-size: 12px; background: #222;
               color: #ddd; padding: 6px; border-radius: 4px; margin-bottom: 4px; }
  .system-line { font-style: italic; font-size: 13px; margin: 2px 8px; color: #ccc; }
  .sys-error { color: #ff8a80; }
  .sys-ok { color: #a5d6a7; }
</style>

<div id="top-bar">
  <div id="home-header">Room {{ room }}</div>
  <div id="round-info">Waiting for the session to start</div>
  <div id="time-left"></div>
  <div id="status-indicators"></div>
</div>

<div id="notice" aria-live="polite"></div>

<div id="room-container">

  <div id="chat-column">
  <div id="messages">

  </div>

  <div id="typing-indicator" aria-live="polite">

  </div>

  </div>

  <div id="stimuli">
    {% for part in participants %}
    <div class="from{{part}} stimImage">
      <img id="stim-{{part}}" alt="Image for participant {{part}}" hidden>
      <div class="obs-board" id="obs-board-{{part}}"></div>
    </div>
    {% endfor %}


    {% if participants|length==1 %}

    <div id="task-board" hidden></div>

    <div id="done-panel" hidden>
      <div id="answer-prompt"></div>
      <div id="answer-options"></div>
      <button id="done-btn" type="button">We're done</button>
    </div>

    <div id="cmd-hints" hidden></div>

    <div id="message-box">
      <textarea type="text" placeholder="Enter your message"
		id="message-input" name="message"
		rows="4"></textarea>

      <button type="submit" id="send-btn" onclick="sendMessage()">Send</button>
    </div>
    {% endif %}

    <!-- admin experimenter view -->
    {% if participants|length != 1 and experimenter %}
    <div id="message-box">
      <textarea id="exp-input" rows="2" placeholder="Message as Experimenter"></textarea>
      <button type="button" id="exp-send">Send</button>
    </div>
    {% endif %}


  </div>

</div>

    <script type="text/javascript">
      const socketio = io({
	  auth: {
	      room: {{ room|tojson }},
	      user_id: {{ (participants[0] if participants|length==1 else none)|tojson }}
	  }
      });
      let lastSeq=0;
      console.log(socketio);
      const isParticipant = {{ (participants|length==1)|tojson }};


      {% if participants|length==1 %}
      const from = '{{participants[0]}}';
      const textarea = document.getElementById('message-input');


      const TYPING_IDLE_MS = 3000;
      let typingTimer = null;
      let isTyping = false;


      let composeSeq=null;

      function startTyping() {
	  if (!isTyping) {
	      isTyping = true;
	      socketio.emit('typing', {
		  from: from, state: 'start'
	      });
	      if (composeSeq === null) composeSeq = lastSeq;
	  }
	  clearTimeout(typingTimer);
	  typingTimer = setTimeout(stopTyping, TYPING_IDLE_MS);
      }

      function stopTyping() {
	  clearTimeout(typingTimer);
	  if (isTyping) {
	      isTyping = false;
	      socketio.emit('typing', {
		  from: from, state: 'stop'
	      });
	  }
      }

      textarea.addEventListener('input', () => {

	  if (textarea.value.trim() === '') stopTyping();
	  else startTyping();
	  updateHints();

      });

      textarea.addEventListener('blur', stopTyping);


      textarea.addEventListener('keydown', function(event) {
              if (event.key === 'Enter') {

		  event.preventDefault();

		  sendMessage();
	      }
      });


      /* ---- COMMAND HINTS (shown while typing a line that starts with /) ---- */
      let commandHelp = '';           // from the task view; empty = no hints

      function updateHints() {
        const box = document.getElementById('cmd-hints');
        const line = textarea.value.split('\n').at(-1);
        if (!commandHelp || !line.startsWith('/')) { box.hidden = true; return; }
        const word = line.slice(1).split(/\s+/)[0].toLowerCase();
        const all = commandHelp.split('\n');
        const match = all.filter(l => l.slice(1).startsWith(word));
        box.textContent = (match.length ? match : all).join('\n');
        box.hidden = false;
      }


      /* ---- DONE AND ANSWER ---- */
      let iAmDone = false;

      function chosen() {
        return [...document.querySelectorAll('#answer-options input:checked')].map(cb => cb.value);
      }

      function limitChoices() {
        if (!answerFormat) return;
        const full = chosen().length >= answerFormat.choose;
        document.querySelectorAll('#answer-options input').forEach(cb => {
          cb.disabled = iAmDone || (full && !cb.checked);
        });
      }

      function setDoneButton(done) {
        iAmDone = done;
        document.getElementById('done-btn').textContent = done ? 'Not done yet' : "We're done";
        limitChoices();
      }


      function resetDonePanel(done) {
        const box = document.getElementById('answer-options');
        box.replaceChildren();
        if (answerFormat) {
          setText('answer-prompt', `When your group agrees, choose ${answerFormat.choose}:`);
          for (const [id, label] of Object.entries(answerFormat.options)) {
            const lab = document.createElement('label');
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.value = id;
            cb.addEventListener('change', limitChoices);
            lab.append(cb, ' ' + label);
            box.appendChild(lab);
          }
        } else {
          setText('answer-prompt', '');
        }
        setDoneButton(Boolean(done));
        document.getElementById('done-panel').hidden = mazeShown;
      }

      document.getElementById('done-btn').addEventListener('click', () => {
        if (!inRound) return;
        if (iAmDone) {
          socketio.emit('task_complete', { done: false });
          return;
        }
	if (!answerFormat) { socketio.emit('task_complete', {done: true}); return; }

	const answer = chosen();
        if (answer.length !== answerFormat.choose) {
          notice(`Please choose ${answerFormat.choose} options first.`);
          return;
        }
        socketio.emit('task_complete', { done: true, answer: answer });
      });


      /* ---- TASK BOARD (matching) ---- */
      let boardView = null;
      let heldCard = null;            // card picked up, waiting to be placed

      function place(card, slot) {
        heldCard = null;
        socketio.emit('task_action', { type: 'place', card: card, slot: slot });
      }

      function img(url, cls) {
        const el = document.createElement('img');
        el.src = url;
        if (cls) el.className = cls;
        return el;
      }

      function slotEl(n, url) {
        const el = document.createElement('div');
        el.className = 'tb-slot';
        const num = document.createElement('span');
        num.className = 'tb-num';
        num.textContent = n;
        if (url) el.appendChild(img(url));
        el.appendChild(num);
        return el;
      }

      function label(text) {
        const el = document.createElement('div');
        el.className = 'tb-label';
        el.textContent = text;
        return el;
      }

      function renderBoard(v) {
        if (!v || !v.grid) return;
        boardView = v;
        const board = document.getElementById('task-board');
        board.replaceChildren();
        board.hidden = false;
        document.querySelectorAll('.stimImage').forEach(d => d.hidden = true);

        const [rows, cols] = v.grid;
        const grid = document.createElement('div');
        grid.className = 'tb-grid';
        grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

        if (v.role === 'director') {
          v.target.forEach((url, i) => grid.appendChild(slotEl(i + 1, url)));
          board.append(label('Target'), grid);
          document.getElementById('done-panel').hidden = true;
          return;
        }

        v.slots.forEach((card, i) => {
          const el = slotEl(i + 1, card ? v.cards[card] : null);
          if (card && card === heldCard) el.classList.add('tb-selected');
          el.addEventListener('click', () => {
            if (!inRound || iAmDone) return;
            if (heldCard && heldCard !== card) place(heldCard, i + 1);
            else if (card) { heldCard = (heldCard === card) ? null : card; renderBoard(boardView); }
          });
          grid.appendChild(el);
        });

        const pool = document.createElement('div');
        pool.className = 'tb-pool';
        pool.addEventListener('click', (e) => {        // put a placed card back
          if (e.target === pool && heldCard && v.slots.includes(heldCard)) place(heldCard, null);
        });
        v.pool.forEach(card => {
          const c = img(v.cards[card], 'tb-card' + (card === heldCard ? ' tb-selected' : ''));
          c.addEventListener('click', () => {
            if (!inRound || iAmDone) return;
            heldCard = (heldCard === card) ? null : card;
            renderBoard(boardView);
          });
          pool.appendChild(c);
        });

        board.append(label('Your grid'), grid, label('Cards'), pool);
      }


      /* ---- MAZE (participant) ---- */
      let mazeShown = false;

      function sendCommand(text) {
        if (!inRound) return;
        socketio.emit('message', { message: text, context_seq: lastSeq });
      }

      function mzButton(text, cmd, enabled, cls) {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = text;
        if (cls) b.className = cls;
        b.disabled = !enabled;
        b.addEventListener('click', () => sendCommand(cmd));
        return b;
      }

      function renderMaze(v) {
        mazeShown = true;
        commandHelp = v.help || '';
        const board = document.getElementById('task-board');
        board.replaceChildren();
        board.hidden = false;
        document.getElementById('done-panel').hidden = true;

        const live = inRound && !v.finished;

        const votes = document.createElement('div');
        votes.className = 'mz-votes';
        for (const pr of v.proposals || []) {
          const mine = pr.by === from;
          const row = document.createElement('div');
          row.className = 'mz-vote-row';
          const lab = document.createElement('span');
          lab.textContent = `${ARROWS[pr.dir]} ${pr.dir} (${pr.by})`;
          row.append(lab,
            mzButton('Agree', `/accept ${pr.dir}`, live && !pr.agree.includes(from)),
            mzButton('Disagree', `/reject ${pr.dir}`, live && !mine && !pr.disagree.includes(from)));
          if (mine) row.append(mzButton('Cancel', '/cancel', live));
          votes.appendChild(row);
        }	

        const pad = document.createElement('div');
        pad.className = 'mz-controls';
        for (const d of ['up', 'left', 'right', 'down'])
          pad.appendChild(mzButton(`${ARROWS[d]} ${d}`, `/go ${d}`, live, 'mz-' + d));


        votes.className = 'mz-votes';
        votes.append(mzButton('Accept', '/accept', live && p && !accepted),
                     mzButton('Reject', '/reject', live && p && !mine),
                     mzButton('Cancel', '/cancel', live && mine));

        board.append(label('Maze'), mazeGrid(v), mazeStatus(v), pad, votes);
      }

      function renderTask(v) {
        if (!v) return;
        if (v.size) renderMaze(v);
        else if (v.grid) renderBoard(v);
      }

      function clearBoard() {
        boardView = null;
        heldCard = null;
        mazeShown = false;
        commandHelp = '';
        updateHints();
        const board = document.getElementById('task-board');
        board.replaceChildren();
        board.hidden = true;
      }

      socketio.on('task_view', renderTask);
      socketio.on('action_error', (e) => notice(e.error));


      {% else %}

      /* ---- OBSERVER BOARDS (read only) ---- */
      const obsViews = {};

      function obsSlot(n, url, mark) {
        const el = document.createElement('div');
        el.className = 'tb-slot' + (mark ? ' ' + mark : '');
        if (url) { const i = document.createElement('img'); i.src = url; el.appendChild(i); }
        const num = document.createElement('span');
        num.className = 'tb-num';
        num.textContent = n;
        el.appendChild(num);
        return el;
      }

      function renderObserver() {
        const target = Object.values(obsViews).find(v => v.role === 'director')?.target;
        for (const v of Object.values(obsViews)) {
          const box = document.getElementById('obs-board-' + v.participant);
          if (!box) continue;
          document.getElementById('stim-' + v.participant).hidden = true;
          box.replaceChildren();
          const title = document.createElement('div');
          title.className = 'obs-title';
          title.textContent = `${v.participant}: ${v.role || 'known cells'}`;

          if (v.size) {                                   // maze
            box.append(title, mazeGrid(v), mazeStatus(v));
            continue;
          }

          const grid = document.createElement('div');
          grid.className = 'tb-grid';
          grid.style.gridTemplateColumns = `repeat(${v.grid[1]}, 1fr)`;

          if (v.role === 'director') {
            v.target.forEach((url, i) => grid.appendChild(obsSlot(i + 1, url)));
            box.append(title, grid);
            continue;
          }
          v.slots.forEach((card, i) => {
            const url = card ? v.cards[card] : null;
            const mark = url && target ? (url === target[i] ? 'obs-ok' : 'obs-bad') : '';
            grid.appendChild(obsSlot(i + 1, url, mark));
          });
          const pool = document.createElement('div');
          pool.className = 'obs-pool';
          v.pool.forEach(c => {
            const fig = document.createElement('figure');
            const i = document.createElement('img');
            i.src = v.cards[c];
            const cap = document.createElement('figcaption');
            cap.textContent = c;
            fig.append(i, cap);
            pool.appendChild(fig);
          });
          box.append(title, grid, pool);
        }
      }

      function clearObserver() {
        for (const k of Object.keys(obsViews)) delete obsViews[k];
        document.querySelectorAll('.obs-board').forEach(b => b.replaceChildren());
      }

      socketio.on('task_view', v => { if (v && v.participant) { obsViews[v.participant] = v; renderObserver(); } });
      socketio.on('session_state', s => {
        if (s.views) { Object.assign(obsViews, s.views); renderObserver(); }
      });
      socketio.on('round_end', clearObserver);

      const expSend = document.getElementById('exp-send');
      if (expSend) {
        const box = document.getElementById('exp-input');
        const send = () => {
          const text = box.value.trim();
          if (!text) return;
          socketio.emit('message', { message: text });
          box.value = '';
        };
        expSend.addEventListener('click', send);
        box.addEventListener('keydown', e => {
          if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
        });
      }


      {% endif %}


      /* --------- END OF PARTICIPANT BLOCK ------ */


      /* ---- MAZE DRAWING (shared by participants and observers) ---- */
      const ARROWS = { up: '↑', down: '↓', left: '←', right: '→' };
      const STEP = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] };
      const CELL_CLASS = { '.': 'mz-open', 'x': 'mz-wall', 's': 'mz-start', 'e': 'mz-end' };

      function cellName(r, c) { return `r${r + 1}c${c + 1}`; }
      function parseCell(n) { const m = /^r(\d+)c(\d+)$/.exec(n); return [m[1] - 1, m[2] - 1]; }

      function mzLabel(text) {
        const el = document.createElement('div');
        el.className = 'mz-label';
        el.textContent = text;
        return el;
      }

      function mazeGrid(v) {
        const [rows, cols] = v.size;
        const path = new Set(v.path);
        const walls = new Set(v.walls_found);

        const targets = {};
        for (const pr of v.proposals || []) {
          const [r, c] = parseCell(v.position);
          const [dr, dc] = STEP[pr.dir];
          targets[cellName(r + dr, c + dc)] = pr.dir;
        }
	
        const grid = document.createElement('div');
        grid.className = 'mz-grid';
        grid.style.gridTemplateColumns = `auto repeat(${cols}, var(--cell))`;
        grid.appendChild(document.createElement('div'));              // corner
        for (let c = 0; c < cols; c++) grid.appendChild(mzLabel(`c${c + 1}`));
        for (let r = 0; r < rows; r++) {
          grid.appendChild(mzLabel(`r${r + 1}`));
          for (let c = 0; c < cols; c++) {
            const name = cellName(r, c);
            const sym = walls.has(name) ? 'x' : v.known[name];
            const el = document.createElement('div');
            el.className = 'mz-cell ' + (CELL_CLASS[sym] || 'mz-unknown');
            el.title = name;
            if (walls.has(name)) el.classList.add('mz-found');
            if (path.has(name)) el.classList.add('mz-path');
            if (sym === 's') el.textContent = 'S';
	    if (sym === 'e') el.textContent = 'E';
            if (targets[name]) { el.classList.add('mz-target'); el.textContent = ARROWS[targets[name]]; }			      

            if (name === v.position) {
              const t = document.createElement('span');
              t.className = 'mz-token';
              el.appendChild(t);
            }
            grid.appendChild(el);
          }
        }
        return grid;
      }

      function mazeStatus(v) {
        const bits = [`Lives: ${v.lives ?? '∞'}`, `Moves left: ${v.moves_left}`];

        for (const pr of v.proposals || [])
          bits.push(`${pr.dir} (${pr.by}): for ${pr.agree.join(', ') || 'nobody'}` +
                    (pr.disagree.length ? `; against ${pr.disagree.join(', ')}` : ''));
        if ((v.proposals || []).length) bits.push(`needs ${v.needed}`);
			      
        if (v.finished) bits.push({ goal: 'Reached the end!', no_lives: 'No lives left',
                                    no_moves: 'No moves left' }[v.finished] || v.finished);
        const el = document.createElement('div');
        el.className = 'mz-status';
        el.textContent = bits.join(' · ');
        return el;
      }


      /* ---- SYSTEM LINES IN THE CHAT (notices and command feedback) ---- */
      function systemLine(text, cls) {
        const messages = document.getElementById('messages');
        const p = document.createElement('p');
        p.className = 'system-line ' + (cls || '');
        p.textContent = text;
        messages.appendChild(p);
        messages.scrollTop = messages.scrollHeight;
      }

      socketio.on('notice', n => systemLine(n.text));
      socketio.on('command_feedback', f => systemLine(
        isParticipant ? f.text : `(to ${f.participant}) ${f.text}`,
        f.ok ? 'sys-ok' : 'sys-error'));


      function setChatOpen(open, note) {
          const input = document.getElementById("message-input");
          const button = document.getElementById("send-btn");
          if (!input) return;
          input.disabled = !open;
          if (button) button.disabled = !open;
          input.placeholder = open ? "Enter your message" : note;
          if (!open) stopTyping();

      }



      /* TYPING indicator */
      const typers = new Set();

      function renderTypers() {
	  const el = document.getElementById('typing-indicator');
	  if (!el) return;

	  const names = [...typers].sort();
	  if (names.length === 0) {
	      el.textContent = '';
	  } else if (names.length === 1) {
	      el.textContent = `${names[0]} is typing...`;
	  } else {
	      el.textContent = `${names.slice(0, -1).join(', ')} and ${names.at(-1)} are typing...`;
	  }
      }


      socketio.on('typing', (data) => {
	  if (data.state === 'start') {
	      typers.add(data.from);
	  } else {
	      typers.delete(data.from);
	  }
	  renderTypers();
      });


      socketio.on('disconnect', () => {
	  typers.clear();
	  renderTypers();
      });


      /* END TYPING indicator */



      socketio.on("message", function (message) {

	  if (typeof message.seq === "number") lastSeq = Math.max(lastSeq, message.seq);

	  typers.delete(message.from);
	  renderTypers();
	  console.log('WS: "message" ' + message.from + ' ' + message.message);
	  createChatItem(message.message, message.from)
      });



    function createChatItem(message, sender) {

      console.log(`${sender}: ${message}`);

	const messages = document.getElementById("messages");
	const p = document.createElement("p");
	p.className = `message from${sender}`;
	p.textContent = `${sender}: ${message}`;

        messages.appendChild(p);

	// Keep inbox scrolled to bottom
	messages.scrollTop = messages.scrollHeight;
    }



   function sendMessage() {

       {% if participants|length==1 %}
       stopTyping();
       {% endif %}


      var msgInput = document.getElementById("message-input");
      var msg = msgInput.value;
      if (msg === "") return;


	console.log(`User ${from} message: ${msg}`);

       socketio.emit("message", { message: msg, from: from,
				  context_seq: composeSeq ?? lastSeq });
       composeSeq = null;
      if (msgInput.disabled === false) msgInput.value = "";

       {% if participants|length==1 %}
       updateHints();
       {% endif %}
   }



      /* ---- SESSION AND ROUNDS ---- */
      let answerFormat = null;      // {choose, options}
      let inRound = false;
      let timerHandle = null;

      const END_REASONS = {
	  all_done: "everyone is done",
	  time_limit: "time is up",
	  message_limit: "message limit reached",
	  experimenter: "ended by the experimenter",
	  session_end: "the session ended",
      };

      function setText(id, text) {
	  const el = document.getElementById(id);
	  if (el) el.textContent = text;
      }

      function notice(text) {
	  setText('notice', text);
      }

      function addDivider(text) {
	  const messages = document.getElementById('messages');
	  const p = document.createElement('p');
	  p.className = 'round-divider';
	  p.textContent = text;
	  messages.appendChild(p);
	  messages.scrollTop = messages.scrollHeight;
      }

      function showStatus(statuses) {
	  const box = document.getElementById('status-indicators');
	  box.textContent = 'Done:';
	  for (const [p, done] of Object.entries(statuses)) {
	      const span = document.createElement('span');
	      span.id = 'status-' + p;
	      span.className = 'status' + (done ? ' done' : '');
	      span.textContent = p;
	      box.appendChild(span);
	  }
      }

      function showMaterials(materials) {
	  for (const [p, url] of Object.entries(materials || {})) {
	      const img = document.getElementById('stim-' + p);
	      if (img) { img.src = url; img.hidden = false; }
	  }
      }

      function startTimer(seconds) {
	  clearInterval(timerHandle);
	  if (seconds == null) { setText('time-left', ''); return; }
	  const deadline = Date.now() + seconds * 1000;
	  const tick = () => {
	      const left = Math.max(0, Math.round((deadline - Date.now()) / 1000));
	      setText('time-left', `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')} left`);
	  };
	  tick();
	  timerHandle = setInterval(tick, 1000);
      }

      function enterRound(round, of, materials, statuses, secondsLeft) {
	  inRound = true;
	  setText('round-info', `Round ${round} of ${of}`);
	  showMaterials(materials);
	  showStatus(statuses);
	  startTimer(secondsLeft);
	  notice('');

      	  if (isParticipant) resetDonePanel(statuses[from]);
      }

      socketio.on('session_start', (data) => {
	  answerFormat = data.answer_format;
	  setText('round-info', `The session is starting: ${data.rounds} rounds`);
      });

      socketio.on('session_state', (s) => {

          setChatOpen(s.round !== null && s.round !== undefined, "Waiting for the round to start...");

	  answerFormat = s.answer_format;
	  if (s.round != null) {
	      enterRound(s.round, s.rounds, s.materials, s.status, s.seconds_left);
	      if (isParticipant && s.view) renderTask(s.view);
	  } else {
	      setText('round-info', 'Waiting for the next round');
	  }


      });

      socketio.on('round_start', (data) => {
	  if (data.clear_chat) document.getElementById('messages').replaceChildren();
	  addDivider(`Round ${data.round} of ${data.of}`);
	  const statuses = Object.fromEntries(data.participants.map(p => [p, false]));
	  enterRound(data.round, data.of, data.materials, statuses, data.time_limit);
      });

      socketio.on('participant_status', (data) => {
	  const el = document.getElementById('status-' + data.participant);
	  if (el) el.classList.toggle('done', data.done);
	  if (isParticipant && data.participant === from) setDoneButton(data.done);
      });

      socketio.on('round_warning', (data) => notice(`${data.seconds_left} seconds left`));
      socketio.on('answers_differ', () => notice("Your answers don't all match yet. Keep discussing."));
      socketio.on('status_error', (data) => notice(data.error));

      socketio.on('round_end', (data) => {
	  inRound = false;
	  clearInterval(timerHandle);
	  setText('time-left', '');
	  addDivider(`Round ${data.round} ended: ${END_REASONS[data.reason] || data.reason}`);
	  setText('round-info', 'Waiting for the next round');
	  notice('');
	  if (isParticipant) {
	      document.getElementById('done-panel').hidden = true;
	      clearBoard();
	  }

      });

      socketio.on('session_end', () => {
	  setText('round-info', 'The session is complete. Thank you!');
	  notice('');
      });



      socketio.on("round_start", () => setChatOpen(true));
      socketio.on("round_end", () => setChatOpen(false, "Waiting for next round..."));
      socketio.on("session_end", () => setChatOpen(false, "The session has ended"));
      socketio.on("message_rejected", (data) => {
              setChatOpen(false, data.error);
      });

  </script>

{% endblock %}
