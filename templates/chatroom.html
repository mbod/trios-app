{% extends 'base.html' %} {% block content %}


<div id="top-bar">

  <div id="home-header">Room {{ room }}</div>
  <div id="completion-indicators">
    Completion Message: 
    {% for part in participants %}
    <label>{{part}}</label>
    <input type="radio" id="complete-{{part}}" disabled/>
    {% endfor %}
  </div>
  
</div>

<div id="room-container">

  <div id="chat-column">
  <div id="messages">

  </div>

  <div id="typing-indicator" aria-live="polite">
XYZ
  </div>

  </div>
  
  <div id="stimuli">
    {% for part in participants %}
    <div class="from{{part}} stimImage">
      
        <img src="{{url_for('static', filename='images/'+imagepath+part+'.svg')}}"/>
        </div>
    {% endfor %}


    {% if participants|length==1 %}

	
	<div id="message-box">

	  <!--
	      <input type="text" placeholder="Enter your message" id="message-input" name="message" />
	  -->


	      <textarea type="text" placeholder="Enter your message"
			id="message-input" name="message"
			rows="4"></textarea>


      
      <button type="submit" id="send-btn" onclick="sendMessage()">Send</button>
    </div>
    {% endif %}

	
  </div>

  


  
</div>

    <script type="text/javascript">
      const socketio = io({ auth: { room: '{{room}}' }});

      {% if participants|length==1 %}
      const from = '{{participants[0]}}';
      const textarea = document.getElementById('message-input');


      const TYPING_IDLE_MS = 3000;
      let typingTimer = null;
      let isTyping = false;

      function startTyping() {
	  if (!isTyping) {
	      isTyping = true;
	      socketio.emit('typing', {
		  from: from, state: 'start'
	      });
	  }
	  clearTimeout(typingTimer);
	  typingTimer = setTimeout(stopTyping, TYPING_IDLE_MS);
      }

      function stopTyping() {
	  clearTimeout(typingTimer);
	  if (isTyping) {
	      isTyping = false;
	      socketio.emit('typing', {
		  from: from, state: 'stop'
	      });
	  }
      }

      textarea.addEventListener('input', () => {

	  if (textarea.value.trim() === '') stopTyping();
	  else startTyping();

      });
	  
      textarea.addEventListener('blur', stopTyping);
      

      textarea.addEventListener('keydown', function(event) {
              if (event.key === 'Enter') {
      
		  event.preventDefault(); 
      
		  sendMessage();
	      }
      });
      
      
      {% endif %}


    console.log(socketio);


      /* TYPING indicator */
      const typers = new Set();

      function renderTypers() {
	  const el = document.getElementById('typing-indicator');
	  if (!el) return;

	  const names = [...typers].sort();
	  if (names.length === 0) {
	      el.textContent = '';
	  } else if (names.length === 1) {
	      el.textContent = `${names[0]} is typing...`;
	  } else {
	      el.textContent = `${names.slice(0, -1).join(', ')} and ${names.at(-1)} are typing...`;
	  }
      }


      socketio.on('typing', (data) => {
	  if (data.state === 'start') {
	      typers.add(data.from);
	  } else {
	      typers.delete(data.from);
	  }
	  renderTypers();
      });


      socketio.on('disconnect', () => {
	  typers.clear();
	  renderTypers();
      });
      

      /* END TYPING indicator */
      

    /* TASK COMPLETE message */
    socketio.on("task_complete", function(message) {
	console.log('WS: task_complete ' + message.from + ' ' + message.message) ;
	 taskComplete(message.from);
    });


      
      socketio.on("message", function (message) {
	  typers.delete(message.from);
	  renderTypers();
	  console.log('WS: "message" ' + message.from + ' ' + message.message);
	  createChatItem(message.message, message.from)
      });



    function taskComplete(senderID) {
	console.log('taskComplete: participant '+ senderID);
	const complete_status = document.getElementById('complete-'+senderID);
	complete_status.checked = true;
    }
      
        
    function createChatItem(message, sender) {

      /* TODO: Fix and check this logic for selecting which WS messages
               to pay attention to - probably a cleaner way of doing this  */
    

      console.log(`${sender}: ${message}`);

     
        
      const messages = document.getElementById("messages");

      content = `<p class="message from${sender}">${sender}: ${message}</p>`;
        
      messages.innerHTML += content;

      // Keep inbox scrolled to bottom
      messages.scrollTop = messages.scrollHeight;        
    }


	   
   function sendMessage() {

       {% if participants|length==1 %}
       stopTyping();
       {% endif %}
       
	  
      var msgInput = document.getElementById("message-input");
      var msg = msgInput.value;
      if (msg === "") return;

            
	console.log(`User ${from} message: ${msg}`);

	socketio.emit("message", { message: msg, from: from });
      msgInput.value = "";
    }


      
  </script>

    




{% endblock %}
